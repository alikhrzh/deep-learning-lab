[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-lab"
version = "0.1.0"
description = "Reproducible deep-learning experiments implemented from first principles."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
